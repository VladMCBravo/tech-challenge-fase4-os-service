version: '3.9'

services:
  postgres-os:
    image: postgres:16-alpine
    container_name: oficina-postgres-os
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: os_db
    ports:
      - '5432:5432'

  postgres-billing:
    image: postgres:16-alpine
    container_name: oficina-postgres-billing
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: billing_db
    ports:
      - '5433:5432'

  mongodb-execution:
    image: mongo:7
    container_name: oficina-mongodb-execution
    ports:
      - '27017:27017'

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: oficina-rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'

  os-service:
    build: .
    container_name: oficina-os-service
    depends_on:
      - postgres-os
      - rabbitmq
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres-os:5432/os_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_QUEUE: os-service.saga.queue
      JWT_SECRET: super-secret-jwt-oficina-soat
    ports:
      - '3000:3000'
