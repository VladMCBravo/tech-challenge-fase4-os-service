name: CI/CD - OS Service (Kubernetes Deploy + SonarQube)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: oficina-eks-cluster-v2
  ECR_REPOSITORY: oficina-os-service

jobs:
  # 1) Build, Testes Automatizados (Unitários + BDD >= 80%) e Qualidade (SonarQube/SonarCloud)
  test-and-quality:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Gerar Prisma Client
        run: DATABASE_URL="postgresql://user:pass@localhost:5432/os_db" npm run prisma:generate

      - name: Executar Testes Unitários + BDD com Cobertura (>= 80%)
        run: npm run test:cov

      - name: Build da aplicação
        run: npm run build

      # O secret precisa estar no env do JOB: "secrets" não pode ser usado em "if" de step,
      # e um env definido só dentro do step não existe no momento em que o "if" é avaliado.
      - name: Aviso — SONAR_TOKEN não configurado
        if: env.SONAR_TOKEN == ''
        run: echo "::warning title=SonarQube::Secret SONAR_TOKEN não configurado neste repositório; análise de qualidade não executada."

      - name: Validação de Qualidade de Código (SonarCloud / SonarQube) + Quality Gate
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          # Aguarda o resultado do Quality Gate: se reprovar, o job falha e o PR fica bloqueado.
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  # 2) Build da imagem Docker e Deploy Automatizado em Kubernetes (Kind no CI; EKS quando o AWS Academy está ativo)
  #    Roda também em Pull Requests como checagem obrigatória: o PR só passa se o serviço sobe no K8s
  #    com banco próprio + RabbitMQ e responde aos health checks.
  build-and-deploy:
    needs: test-and-quality
    runs-on: ubuntu-latest
    env:
      HAS_AWS_CREDENTIALS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build da imagem Docker do microsserviço
        run: |
          docker build -t oficina-os-service:${{ github.sha }} -t oficina-os-service:latest .

      # Caminho A: Se a conta AWS Academy estiver ativa com Secrets configurados, publica no ECR e faz deploy no EKS
      - name: Configurar credenciais da AWS (EKS)
        if: env.HAS_AWS_CREDENTIALS == 'true'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # Caminho B (Sempre executado para garantir evidência de deploy K8s mesmo com AWS Academy desligado): Cluster Kubernetes Kind
      - name: Criar cluster Kubernetes (Kind) para Deploy Automatizado
        uses: helm/kind-action@0025e74a8c7512023d06dc019c617aa3cf561fde # v1.10.0
        with:
          cluster_name: oficina-k8s

      - name: Carregar imagem Docker no cluster Kubernetes
        run: |
          kind load docker-image oficina-os-service:latest --name oficina-k8s

      - name: Instalar metrics-server (métricas de CPU/memória para o HPA)
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.7.2/components.yaml
          kubectl -n kube-system patch deployment metrics-server --type=json \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'

      - name: Deploy automatizado em Kubernetes + health checks (scripts/deploy-k8s.sh)
        run: ./scripts/deploy-k8s.sh

      - name: Evidência do HPA com métricas coletadas
        if: always()
        run: |
          kubectl -n kube-system rollout status deployment/metrics-server --timeout=120s || true
          sleep 30
          kubectl get hpa -o wide || true
          kubectl top pods || true
